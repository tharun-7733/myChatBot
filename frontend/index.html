<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QwenChat</title>
  <meta name="description" content="A minimal chatbot powered by a fine-tuned Qwen2.5 LoRA model." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;1,14..32,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f0ed;
      --surface: #e8e8e4;
      --surface-hover: #e0e0db;
      --border: rgba(0,0,0,0.08);
      --text-primary: #1a1a1a;
      --text-secondary: #666;
      --text-label: #999;
      --input-bg: rgba(255,255,255,0.7);
      --input-border: rgba(0,0,0,0.1);
      --send-bg: #1a1a1a;
      --sidebar-w: 260px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Shell ── */
    #shell {
      display: flex;
      height: 100vh;
      width: 100%;
      position: relative;
    }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: #ebebе8;
      background: #ebebе7;
      background: color-mix(in srgb, var(--bg) 60%, #d8d8d4 40%);
      border-right: 1px solid rgba(0,0,0,0.07);
      display: flex;
      flex-direction: column;
      transform: translateX(calc(-1 * var(--sidebar-w)));
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    #sidebar.open {
      transform: translateX(0);
    }

    #sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      flex-shrink: 0;
    }

    #sidebar-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }

    #sidebar-close {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      color: var(--text-label); border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      font-size: 16px;
    }
    #sidebar-close:hover { background: var(--surface-hover); color: var(--text-primary); }

    #conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      scrollbar-width: none;
    }
    #conv-list::-webkit-scrollbar { display: none; }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      user-select: none;
    }

    .conv-item:hover { background: rgba(0,0,0,0.05); }
    .conv-item.active { background: rgba(0,0,0,0.08); }

    .conv-icon {
      flex-shrink: 0;
      width: 20px; height: 20px;
      opacity: 0.35;
    }

    .conv-meta { flex: 1; min-width: 0; }

    .conv-title {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }

    .conv-subtitle {
      font-size: 11.5px;
      color: var(--text-label);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .conv-item.active .conv-title { font-weight: 500; }

    #sidebar-new {
      padding: 12px;
      border-top: 1px solid rgba(0,0,0,0.06);
      flex-shrink: 0;
    }

    #sidebar-new-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: rgba(0,0,0,0.05);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-secondary);
      transition: background 0.15s, color 0.15s;
      letter-spacing: -0.01em;
    }

    #sidebar-new-btn:hover { background: rgba(0,0,0,0.09); color: var(--text-primary); }

    /* ── Overlay ── */
    #overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0);
      z-index: 90;
      transition: background 0.28s;
    }
    #overlay.visible {
      display: block;
      background: rgba(0,0,0,0.12);
    }

    /* ── Main ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
    }

    /* ── Top Bar ── */
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      flex-shrink: 0;
    }

    #topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #menu-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      border-radius: 7px;
      transition: background 0.15s;
      opacity: 0.55;
      flex-shrink: 0;
    }
    #menu-btn:hover { background: var(--surface); opacity: 1; }
    #menu-btn svg { width: 18px; height: 18px; }

    #logo {
      display: flex; align-items: center; justify-content: center;
      opacity: 0.55;
    }
    #logo svg { width: 20px; height: 20px; }

    #new-thread-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13.5px;
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      letter-spacing: -0.01em;
    }
    #new-thread-btn:hover { background: var(--surface); color: var(--text-primary); }

    /* ── Messages ── */
    #messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0 40px;
      scrollbar-width: none;
    }
    #messages-area::-webkit-scrollbar { display: none; }

    #messages-inner {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      flex-direction: column;
    }

    .msg-row {
      display: flex;
      gap: 6px;
      padding: 3px 0;
      animation: fadeUp 0.18s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-label {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-label);
      flex-shrink: 0;
      white-space: nowrap;
      user-select: none;
    }

    .msg-content {
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.65;
    }

    .msg-content p { margin-bottom: 0.4em; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content strong { font-weight: 600; }
    .msg-content em { font-style: italic; }
    .msg-content code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      background: rgba(0,0,0,0.07);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .msg-content pre {
      background: rgba(0,0,0,0.06);
      border-radius: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .msg-content pre code { background: none; padding: 0; }
    .msg-content ul, .msg-content ol { padding-left: 1.4em; margin: 4px 0; }
    .msg-content li { margin: 2px 0; }
    .msg-content a { color: #555; text-decoration: underline; }
    .msg-content blockquote {
      border-left: 2px solid rgba(0,0,0,0.15);
      padding-left: 12px;
      color: var(--text-secondary);
      margin: 6px 0;
    }

    .streaming-cursor::after {
      content: '';
      display: inline-block;
      width: 8px; height: 14px;
      background: var(--text-label);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.7s step-end infinite;
      border-radius: 1px;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── Welcome ── */
    #welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 60px 28px 0;
      max-width: 600px;
      margin: 0 auto;
      gap: 28px;
    }

    #welcome-screen h1 {
      font-size: 21px;
      font-weight: 450;
      color: var(--text-primary);
      letter-spacing: -0.025em;
    }

    .starter-list { display: flex; flex-direction: column; gap: 2px; width: 100%; }

    .starter-btn {
      background: none; border: none; cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-secondary);
      text-align: left;
      padding: 7px 0;
      transition: color 0.12s;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }
    .starter-btn:hover { color: var(--text-primary); }
    .starter-btn::before { content: '→  '; color: var(--text-label); font-size: 13px; }

    /* ── Input ── */
    #input-area {
      flex-shrink: 0;
      padding: 0 20px 28px;
      display: flex;
      justify-content: center;
    }

    #input-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 9999px;
      padding: 10px 10px 10px 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    #input-wrapper:focus-within {
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      border-color: rgba(0,0,0,0.18);
    }

    #user-input {
      flex: 1;
      background: none; border: none; outline: none;
      font-family: var(--font);
      font-size: 14.5px;
      color: var(--text-primary);
      line-height: 1.5;
      resize: none;
      max-height: 120px;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    #user-input::placeholder { color: var(--text-label); }
    #user-input::-webkit-scrollbar { display: none; }

    #send-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--send-bg);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.15s;
    }
    #send-btn:hover:not(:disabled) { opacity: 0.75; transform: scale(1.06); }
    #send-btn:active:not(:disabled) { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.2; cursor: not-allowed; }
    #send-btn svg { width: 15px; height: 15px; }

    /* Empty state in sidebar */
    .conv-empty {
      padding: 20px 12px;
      font-size: 13px;
      color: var(--text-label);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div id="shell">

  <!-- Sidebar overlay -->
  <div id="overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-title">Conversations</span>
      <button id="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div id="conv-list"></div>
    <div id="sidebar-new">
      <button id="sidebar-new-btn" onclick="newChat(); closeSidebar();">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        New conversation
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div id="main">
    <div id="topbar">
      <div id="topbar-left">
        <button id="menu-btn" onclick="toggleSidebar()" title="Conversations">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6H20M4 12H20M4 18H20" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <div id="logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L22 12L12 22L2 12L12 2Z" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M12 7L17 12L12 17L7 12L12 7Z" stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <button id="new-thread-btn" onclick="newChat()">+ New Thread</button>
    </div>

    <div id="messages-area">
      <div id="messages-inner"></div>
    </div>

    <div id="input-area">
      <div id="input-wrapper">
        <textarea
          id="user-input"
          rows="1"
          placeholder="Type a message..."
          onkeydown="handleKey(event)"
          oninput="autoResize()"
        ></textarea>
        <button id="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>
<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let conversations = [], activeConvId = null, isStreaming = false;
  const BACKEND_URL = 'http://localhost:8000';

  // ── Sidebar ────────────────────────────────────────────────────────────────
  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    if (sb.classList.contains('open')) closeSidebar();
    else openSidebar();
  }

  function openSidebar() {
    renderSidebar();
    document.getElementById('sidebar').classList.add('open');
    const ov = document.getElementById('overlay');
    ov.style.display = 'block';
    requestAnimationFrame(() => ov.classList.add('visible'));
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    const ov = document.getElementById('overlay');
    ov.classList.remove('visible');
    setTimeout(() => { ov.style.display = 'none'; }, 280);
  }

  function renderSidebar() {
    const list = document.getElementById('conv-list');
    list.innerHTML = '';

    if (conversations.length === 0) {
      list.innerHTML = '<div class="conv-empty">No conversations yet.<br>Start a new thread!</div>';
      return;
    }

    // Show newest first
    [...conversations].reverse().forEach(conv => {
      const item = document.createElement('div');
      item.className = 'conv-item' + (conv.id === activeConvId ? ' active' : '');

      const firstUserMsg = conv.messages.find(m => m.role === 'user');
      const title = firstUserMsg
        ? firstUserMsg.content.slice(0, 42) + (firstUserMsg.content.length > 42 ? '…' : '')
        : 'New conversation';
      const subtitle = conv.messages.length > 0
        ? conv.messages.length + ' message' + (conv.messages.length !== 1 ? 's' : '')
        : 'Empty';

      item.innerHTML = `
        <svg class="conv-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <div class="conv-meta">
          <div class="conv-title">${escHtml(title)}</div>
          <div class="conv-subtitle">${escHtml(subtitle)}</div>
        </div>`;

      item.onclick = () => { loadConv(conv.id); closeSidebar(); };
      list.appendChild(item);
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function loadConv(id) {
    const conv = conversations.find(c => c.id === id);
    if (!conv) return;
    activeConvId = id;
    const inner = document.getElementById('messages-inner');
    inner.innerHTML = '';
    if (conv.messages.length === 0) { showWelcome(); return; }
    conv.messages.forEach(m => appendMessage(m.role, m.content, false));
    scrollBottom();
  }

  // ── Utilities ──────────────────────────────────────────────────────────────
  function md(text) {
    if (!text) return '';
    return marked.parse(text, { breaks: true, gfm: true });
  }

  function scrollBottom() {
    const a = document.getElementById('messages-area');
    a.scrollTop = a.scrollHeight;
  }

  function getActiveConv() {
    return conversations.find(c => c.id === activeConvId);
  }

  // ── Welcome ────────────────────────────────────────────────────────────────
  function showWelcome() {
    const inner = document.getElementById('messages-inner');
    inner.innerHTML = `
      <div id="welcome-screen">
        <h1>What can I help you with?</h1>
        <div class="starter-list">
          <button class="starter-btn" onclick="useStarter(this)">Explain quantum computing simply</button>
          <button class="starter-btn" onclick="useStarter(this)">Write a Python web scraper</button>
          <button class="starter-btn" onclick="useStarter(this)">Draft a professional email</button>
          <button class="starter-btn" onclick="useStarter(this)">Summarize the idea of superposition</button>
        </div>
      </div>`;
  }

  function hideWelcome() {
    const w = document.getElementById('welcome-screen');
    if (w) w.remove();
  }

  // ── Chat management ────────────────────────────────────────────────────────
  function newChat() {
    const conv = { id: Date.now(), messages: [] };
    conversations.push(conv);
    activeConvId = conv.id;
    showWelcome();
  }

  // ── Render a message ───────────────────────────────────────────────────────
  function appendMessage(role, content, animate = true) {
    hideWelcome();
    const inner = document.getElementById('messages-inner');
    const row = document.createElement('div');
    row.className = 'msg-row';
    if (!animate) row.style.animation = 'none';

    const label = document.createElement('span');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You: ' : 'AI: ';

    const contentEl = document.createElement('span');
    contentEl.className = 'msg-content';

    if (role === 'user') {
      contentEl.textContent = content;
    } else {
      contentEl.innerHTML = content ? md(content) : '';
    }

    row.appendChild(label);
    row.appendChild(contentEl);
    inner.appendChild(row);
    scrollBottom();
    return { row, contentEl };
  }

  function showTyping() {
    hideWelcome();
    const inner = document.getElementById('messages-inner');
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.id = 'typing-row';

    const label = document.createElement('span');
    label.className = 'msg-label';
    label.textContent = 'AI: ';

    const contentEl = document.createElement('span');
    contentEl.className = 'msg-content streaming-cursor';

    row.appendChild(label);
    row.appendChild(contentEl);
    inner.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing-row');
    if (t) t.remove();
  }

  // ── Input helpers ──────────────────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize() {
    const tx = document.getElementById('user-input');
    tx.style.height = 'auto';
    tx.style.height = Math.min(tx.scrollHeight, 120) + 'px';
    tx.style.overflowY = tx.scrollHeight > 120 ? 'auto' : 'hidden';
  }

  function useStarter(btn) {
    const text = btn.textContent.replace(/^→\s*/, '').trim();
    document.getElementById('user-input').value = text;
    autoResize();
    sendMessage();
  }

  // ── Send & Stream ──────────────────────────────────────────────────────────
  async function sendMessage() {
    if (isStreaming) return;
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    if (!activeConvId) newChat();
    const conv = getActiveConv();
    if (!conv) return;

    conv.messages.push({ role: 'user', content: text });
    appendMessage('user', text);
    input.value = '';
    input.style.height = 'auto';

    isStreaming = true;
    document.getElementById('send-btn').disabled = true;
    showTyping();

    let aiText = '', aiContentEl = null;

    try {
      const res = await fetch(BACKEND_URL + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: conv.messages,
          system_prompt: 'You are a helpful, friendly AI assistant powered by a fine-tuned Qwen2.5 model.',
          temperature: 0.7,
          max_new_tokens: 512,
          top_p: 0.9
        }),
        signal: AbortSignal.timeout(300000)
      });

      if (!res.ok || !res.body) throw new Error('Server error: ' + res.status);

      removeTyping();
      const { contentEl } = appendMessage('assistant', '', true);
      aiContentEl = contentEl;
      aiContentEl.classList.add('streaming-cursor');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') break;
          try {
            const j = JSON.parse(raw);
            if (j.token) {
              aiText += j.token;
              aiContentEl.innerHTML = md(aiText);
              aiContentEl.classList.add('streaming-cursor');
              scrollBottom();
            }
          } catch {}
        }
      }

    } catch (err) {
      removeTyping();
      if (!aiContentEl) {
        const { contentEl } = appendMessage('assistant', '', true);
        aiContentEl = contentEl;
      }
      aiText = 'Connection error: ' + err.message;
      aiContentEl.textContent = aiText;
    }

    if (aiContentEl) aiContentEl.classList.remove('streaming-cursor');
    conv.messages.push({ role: 'assistant', content: aiText });
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    scrollBottom();
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  newChat();
</script>
