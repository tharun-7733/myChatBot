<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="A premium chatbot powered by a fine-tuned Qwen2.5-1.5B LoRA model." />
  <style>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; color: #e2e2e2; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    #aurora-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #sidebar {
      width: 260px; height: 100vh;
      background: rgba(13,13,20,0.85); backdrop-filter: blur(24px);
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), margin-left 0.3s cubic-bezier(0.4,0,0.2,1);
      position: relative; z-index: 10;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(0,242,255,0.6); animation: bounce 1s infinite; box-shadow: 0 0 6px rgba(0,242,255,0.5); }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-7px); opacity: 1; } }
    .streaming-cursor::after { content: '▋'; display: inline-block; animation: blink 0.7s step-end infinite; color: #00f2ff; margin-left: 2px; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    .msg-bubble pre { margin: 10px 0; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
    .msg-bubble pre code { font-size: 12.5px; font-family: 'Fira Code', monospace; }
    .msg-bubble p { margin-bottom: 0.75em; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 1.4em; margin: 0.5em 0; }
    .msg-bubble li { margin: 0.3em 0; }
    .msg-bubble code:not(.hljs) { font-family: 'Fira Code', monospace; font-size: 12.5px; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; }
    .msg-bubble a { color: #00f2ff; text-decoration: none; }
    .msg-bubble a:hover { text-decoration: underline; }
    .msg-bubble strong { font-weight: 600; color: #e1fdff; }
    .msg-bubble blockquote { border-left: 3px solid #00f2ff; padding-left: 12px; color: #b9cacb; margin: 0.5em 0; }
    .input-wrapper:focus-within { border-color: rgba(0,242,255,0.5) !important; box-shadow: 0 0 0 3px rgba(0,242,255,0.08); }
    .chat-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #b9cacb; display: flex; align-items: center; gap: 8px; transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-item:hover { background: rgba(255,255,255,0.04); color: #e2e2e2; }
    .chat-item.active { background: rgba(0,242,255,0.08); color: #00f2ff; }
    @keyframes statusPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 50% { box-shadow: 0 0 0 4px rgba(16,185,129,0); } }
    .status-online { background: #10b981 !important; animation: statusPulse 2s ease-in-out infinite; }
    @keyframes orbPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(0,242,255,0.4); } 50% { box-shadow: 0 0 0 8px rgba(0,242,255,0); } }
    .orb-pulse { animation: orbPulse 3s ease-in-out infinite; }
    @keyframes aiGlow { 0%,100% { box-shadow: 0 0 10px rgba(0,242,255,0.15); } 50% { box-shadow: 0 0 20px rgba(0,242,255,0.35); } }
    .ai-glow { animation: aiGlow 3s ease-in-out infinite; }
    #settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s; }

    #settings-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 340px; background: rgba(13,13,20,0.97); border-left: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(24px); padding: 28px 24px; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }

  <!-- Main -->
  <div id="main" style="flex:1;display:flex;flex-direction:column;height:100vh;min-width:0;">

<script>
// Aurora background
(function() {
  const canvas = document.getElementById('aurora-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, t = 0;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const blobs = [
    { x:0.75, y:0.15, r:0.42, col:'rgba(0,242,255,0.07)' },
    { x:0.1,  y:0.7,  r:0.35, col:'rgba(52,78,77,0.12)' },
    { x:0.5,  y:0.5,  r:0.25, col:'rgba(0,219,231,0.05)' },
  ];
  function draw() {
    ctx.clearRect(0,0,W,H);
    blobs.forEach((b,i) => {
      const ox = Math.sin(t*0.0003+i*2)*0.06*W, oy = Math.cos(t*0.0004+i*1.5)*0.06*H;
      const g = ctx.createRadialGradient(b.x*W+ox,b.y*H+oy,0,b.x*W+ox,b.y*H+oy,b.r*Math.max(W,H));
      g.addColorStop(0,b.col); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    });
    t+=16; requestAnimationFrame(draw);
  }
  draw();
})();

let conversations=[], activeConvId=null, isStreaming=false, sidebarOpen=true;

function getBackendURL(){ return (document.getElementById('setting-backend-url')?.value||'').replace(/\/$/,''); }
function getSystemPrompt(){ return document.getElementById('setting-system-prompt')?.value||'You are a helpful AI.'; }
function getTemp(){ return parseFloat(document.getElementById('setting-temp')?.value||0.7); }
function getTokens(){ return parseInt(document.getElementById('setting-tokens')?.value||512); }
function getTopP(){ return parseFloat(document.getElementById('setting-topp')?.value||0.9); }
function timeNow(){ return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function md(t){ return t?marked.parse(t,{breaks:true,gfm:true}):''; }
function hl(el){ el.querySelectorAll('pre code').forEach(b=>hljs.highlightElement(b)); }

function toggleSidebar(){
  sidebarOpen=!sidebarOpen;
  const s=document.getElementById('sidebar');
  s.style.transform=sidebarOpen?'translateX(0)':'translateX(-260px)';
  s.style.marginLeft=sidebarOpen?'0':'-260px';
}

function renderHistory(){
  const el=document.getElementById('chat-history'); el.innerHTML='';
  conversations.slice().reverse().forEach(conv=>{
    const d=document.createElement('div');
    d.className='chat-item'+(conv.id===activeConvId?' active':'');
    d.innerHTML=`<span class="material-symbols-outlined" style="font-size:16px;flex-shrink:0;">chat</span><span style="overflow:hidden;text-overflow:ellipsis;">${conv.title}</span>`;
    d.onclick=()=>loadConv(conv.id);
    el.appendChild(d);
  });
}

function newChat(){
  const conv={id:Date.now(),title:'New Conversation',messages:[]};
  conversations.push(conv); activeConvId=conv.id;
  document.getElementById('chat-title').textContent=conv.title;
  showWelcome(); renderHistory();
}

function loadConv(id){
  const conv=conversations.find(c=>c.id===id); if(!conv)return;
  activeConvId=id; document.getElementById('chat-title').textContent=conv.title;
  const inner=document.getElementById('messages-inner'); inner.innerHTML='';
  conv.messages.forEach(m=>appendBubble(m.role,m.content,false));
  renderHistory(); scrollBottom();
}

function getActiveConv(){ return conversations.find(c=>c.id===activeConvId); }

function showWelcome(){
  const inner=document.getElementById('messages-inner');
  inner.innerHTML=`
    <div id="welcome-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;gap:16px;">
      <div class="welcome-float" style="width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,#00f2ff,#74f5ff,#00dbe7);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(0,242,255,0.25);">
        <span class="material-symbols-outlined" style="font-size:40px;color:#00363a;">neurology</span>
      </div>
      <div style="font-size:36px;font-weight:700;background:linear-gradient(135deg,#00f2ff,#74f5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Welcome to QwenChat</div>
      <div style="font-size:16px;color:#b9cacb;max-width:440px;line-height:1.65;">Powered by a fine-tuned Qwen2.5-1.5B LoRA model running on Beam Cloud GPU infrastructure.</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;">
        <button class="chip-btn" onclick="useChip(this)" style="padding:10px 18px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:9999px;font-size:13px;color:#b9cacb;cursor:pointer;display:flex;align-items:center;gap:6px;"><span class="material-symbols-outlined" style="font-size:16px;color:#00f2ff;">lightbulb</span> Explain quantum computing</button>
        <button class="chip-btn" onclick="useChip(this)" style="padding:10px 18px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:9999px;font-size:13px;color:#b9cacb;cursor:pointer;display:flex;align-items:center;gap:6px;"><span class="material-symbols-outlined" style="font-size:16px;color:#00f2ff;">code</span> Write a Python web scraper</button>
        <button class="chip-btn" onclick="useChip(this)" style="padding:10px 18px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:9999px;font-size:13px;color:#b9cacb;cursor:pointer;display:flex;align-items:center;gap:6px;"><span class="material-symbols-outlined" style="font-size:16px;color:#00f2ff;">edit</span> Draft a professional email</button>
        <button class="chip-btn" onclick="useChip(this)" style="padding:10px 18px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:9999px;font-size:13px;color:#b9cacb;cursor:pointer;display:flex;align-items:center;gap:6px;"><span class="material-symbols-outlined" style="font-size:16px;color:#00f2ff;">psychology</span> What can you help me with?</button>
      </div>
    </div>`;
}

function hideWelcome(){ const w=document.getElementById('welcome-screen'); if(w)w.remove(); }

function appendBubble(role,content,animate=true){
  hideWelcome();
  const inner=document.getElementById('messages-inner');
  const row=document.createElement('div');
  const isUser=role==='user';
  row.style.cssText='display:flex;flex-direction:column;align-items:'+(isUser?'flex-end':'flex-start')+';gap:4px;width:100%;'+(animate?'animation:msgIn 0.35s cubic-bezier(0.4,0,0.2,1);':'');
  if(isUser){
    row.innerHTML=`
      <div style="max-width:78%;background:linear-gradient(135deg,rgba(0,242,255,0.12),rgba(116,245,255,0.08));backdrop-filter:blur(12px);border:1px solid rgba(0,242,255,0.2);border-radius:18px 18px 4px 18px;padding:14px 18px;font-size:14.5px;line-height:1.65;color:#e2e2e2;box-shadow:0 4px 24px rgba(0,242,255,0.08);">${content}</div>
      <span style="font-size:10px;color:rgba(185,202,203,0.45);padding-right:4px;">${timeNow()}</span>`;
  } else {
    const bid='b'+Date.now()+Math.random().toString(36).slice(2);
    row.dataset.bubbleId=bid;
    row.innerHTML=`
      <div style="display:flex;gap:12px;max-width:88%;">
        <div class="ai-glow" style="width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,242,255,0.35);background:rgba(5,5,8,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;">
          <span class="material-symbols-outlined" style="font-size:18px;color:#00f2ff;">smart_toy</span>
        </div>
        <div>
          <div id="${bid}" class="msg-bubble" style="background:linear-gradient(135deg,rgba(0,242,255,0.07),rgba(255,255,255,0.02));backdrop-filter:blur(16px);border:1px solid rgba(0,242,255,0.15);border-radius:18px 18px 18px 4px;padding:16px 18px;font-size:14.5px;line-height:1.65;color:#e2e2e2;box-shadow:0 4px 24px rgba(0,0,0,0.3);">${content?md(content):''}</div>
          <span style="font-size:10px;color:rgba(185,202,203,0.45);padding-left:4px;">${timeNow()}</span>
        </div>
      </div>`;
    if(content){ const el=document.getElementById(bid); if(el)hl(el); }
  }
  inner.appendChild(row); scrollBottom(); return row;
}

function showTyping(){
  hideWelcome();
  const inner=document.getElementById('messages-inner');
  const row=document.createElement('div');
  row.id='typing-row'; row.style.cssText='display:flex;gap:12px;align-items:flex-start;animation:msgIn 0.35s cubic-bezier(0.4,0,0.2,1);';
  row.innerHTML=`
    <div class="ai-glow" style="width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,242,255,0.35);background:rgba(5,5,8,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <span class="material-symbols-outlined" style="font-size:18px;color:#00f2ff;">smart_toy</span>
    </div>
    <div style="background:rgba(27,27,27,0.8);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.06);border-radius:18px 18px 18px 4px;padding:14px 18px;display:flex;align-items:center;gap:5px;">
      <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
    </div>`;
  inner.appendChild(row); scrollBottom();
}

function removeTyping(){ const t=document.getElementById('typing-row'); if(t)t.remove(); }
function scrollBottom(){ const a=document.getElementById('messages-area'); a.scrollTop=a.scrollHeight; }

function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }

function useChip(btn){
  const txt=btn.innerText.trim().replace(/^[^\w\s]+\s*/,'');
  document.getElementById('user-input').value=txt; autoResize(); sendMessage();
}

function autoResize(){
  const tx=document.getElementById('user-input');
  tx.style.height='auto'; tx.style.height=Math.min(tx.scrollHeight,160)+'px';
  tx.style.overflowY=tx.scrollHeight>160?'auto':'hidden';
}

async function sendMessage(){
  if(isStreaming)return;
  const input=document.getElementById('user-input');
  const text=input.value.trim(); if(!text)return;
  if(!activeConvId)newChat();
  const conv=getActiveConv(); if(!conv)return;
  conv.messages.push({role:'user',content:text});
  if(conv.title==='New Conversation'){ conv.title=text.slice(0,42)+(text.length>42?'…':''); document.getElementById('chat-title').textContent=conv.title; }
  appendBubble('user',text); input.value=''; input.style.height='auto'; renderHistory();
  isStreaming=true;
  const btn=document.getElementById('send-btn'); btn.disabled=true; btn.classList.add('loading');
  showTyping();
  let aiText='', aiRow=null, bubbleEl=null;
  try{
    const res=await fetch(getBackendURL()+'/chat',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:conv.messages,system_prompt:getSystemPrompt(),temperature:getTemp(),max_new_tokens:getTokens(),top_p:getTopP()})
    });
    if(!res.ok||!res.body)throw new Error('Server error: '+res.status);
    const reader=res.body.getReader(), decoder=new TextDecoder();
    removeTyping(); aiRow=appendBubble('assistant','',true);
    bubbleEl=document.getElementById(aiRow.dataset.bubbleId);
    if(bubbleEl)bubbleEl.classList.add('streaming-cursor');
    let buf='';
    while(true){
      const{done,value}=await reader.read(); if(done)break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const raw=line.slice(6).trim(); if(raw==='[DONE]')break;
        try{const j=JSON.parse(raw);if(j.token){aiText+=j.token;if(bubbleEl){bubbleEl.innerHTML=md(aiText);bubbleEl.classList.add('streaming-cursor');hl(bubbleEl);}scrollBottom();}}catch{}
      }
    }
  }catch(err){
    removeTyping();
    if(!aiRow){aiRow=appendBubble('assistant','',true);bubbleEl=document.getElementById(aiRow.dataset.bubbleId);}
    aiText='**Connection error:** '+err.message+'\n\nCheck the backend URL in Settings.';
    if(bubbleEl)bubbleEl.innerHTML=md(aiText);
  }
  if(bubbleEl){bubbleEl.classList.remove('streaming-cursor');hl(bubbleEl);}
  conv.messages.push({role:'assistant',content:aiText});
  isStreaming=false; btn.disabled=false; btn.classList.remove('loading');
  const chips=document.getElementById('context-chips'); if(chips)chips.style.display='flex';
  scrollBottom();
}

function openSettings(){ document.getElementById('settings-overlay').classList.add('open'); }
function closeSettings(){ document.getElementById('settings-overlay').classList.remove('open'); }
document.getElementById('settings-overlay').addEventListener('click',function(e){if(e.target===this)closeSettings();});

async function checkHealth(){
  const d1=document.getElementById('status-dot'),det=document.getElementById('status-detail'),d2=document.getElementById('header-status-dot'),txt=document.getElementById('header-status-text');
  try{
    const res=await fetch(getBackendURL()+'/health',{signal:AbortSignal.timeout(6000)});
    if(res.ok){d1.classList.add('status-online');d1.style.background='#10b981';det.textContent='Backend ready';d2.style.background='#10b981';txt.textContent='Online';txt.style.color='#10b981';}
    else throw new Error();
  }catch{d1.style.background='#f59e0b';det.textContent='Waking up GPU…';d2.style.background='#f59e0b';txt.textContent='Connecting…';txt.style.color='#b9cacb';}
}

checkHealth(); setInterval(checkHealth,30000); newChat();
</script>
