<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QwenChat</title>
  <meta name="description" content="A minimal chatbot powered by a fine-tuned Qwen2.5 LoRA model." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;1,14..32,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f0ed;
      --surface: #e8e8e4;
      --border: rgba(0,0,0,0.08);
      --text-primary: #1a1a1a;
      --text-secondary: #666;
      --text-label: #999;
      --input-bg: rgba(255,255,255,0.7);
      --input-border: rgba(0,0,0,0.1);
      --send-bg: #1a1a1a;
      --send-icon: #fff;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 100%;
    }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      flex-shrink: 0;
    }

    #logo {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
    }

    #logo svg { width: 22px; height: 22px; }

    #new-thread-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13.5px;
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      letter-spacing: -0.01em;
    }

    #new-thread-btn:hover {
      background: var(--surface);
      color: var(--text-primary);
    }

    #messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0 40px;
      scrollbar-width: none;
    }
    #messages-area::-webkit-scrollbar { display: none; }

    #messages-inner {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      flex-direction: column;
    }

    .msg-row {
      display: flex;
      gap: 6px;
      padding: 3px 0;
      animation: fadeUp 0.18s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-label {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-label);
      flex-shrink: 0;
      white-space: nowrap;
      user-select: none;
    }

    .msg-content {
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.65;
      font-weight: 400;
    }

    .msg-content p { margin-bottom: 0.4em; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content strong { font-weight: 600; }
    .msg-content em { font-style: italic; }
    .msg-content code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      background: rgba(0,0,0,0.07);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .msg-content pre {
      background: rgba(0,0,0,0.06);
      border-radius: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .msg-content pre code { background: none; padding: 0; }
    .msg-content ul, .msg-content ol { padding-left: 1.4em; margin: 4px 0; }
    .msg-content li { margin: 2px 0; }
    .msg-content a { color: #555; text-decoration: underline; }
    .msg-content blockquote {
      border-left: 2px solid rgba(0,0,0,0.15);
      padding-left: 12px;
      color: var(--text-secondary);
      margin: 6px 0;
    }

    .streaming-cursor::after {
      content: '';
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--text-label);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.7s step-end infinite;
      border-radius: 1px;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    /* Welcome */
    #welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 60px 28px 0;
      max-width: 600px;
      margin: 0 auto;
      gap: 28px;
    }

    #welcome-screen h1 {
      font-size: 21px;
      font-weight: 450;
      color: var(--text-primary);
      letter-spacing: -0.025em;
      line-height: 1.3;
    }

    .starter-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
    }

    .starter-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-secondary);
      text-align: left;
      padding: 7px 0;
      transition: color 0.12s;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    .starter-btn:hover { color: var(--text-primary); }

    .starter-btn::before {
      content: '→  ';
      color: var(--text-label);
      font-size: 13px;
    }

    /* Input */
    #input-area {
      flex-shrink: 0;
      padding: 0 20px 28px;
      display: flex;
      justify-content: center;
    }

    #input-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 9999px;
      padding: 10px 10px 10px 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    #input-wrapper:focus-within {
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      border-color: rgba(0,0,0,0.18);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: var(--font);
      font-size: 14.5px;
      color: var(--text-primary);
      line-height: 1.5;
      resize: none;
      max-height: 120px;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    #user-input::placeholder { color: var(--text-label); }
    #user-input::-webkit-scrollbar { display: none; }

    #send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--send-bg);
      color: var(--send-icon);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.15s;
    }

    #send-btn:hover:not(:disabled) { opacity: 0.75; transform: scale(1.06); }
    #send-btn:active:not(:disabled) { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.2; cursor: not-allowed; }
    #send-btn svg { width: 15px; height: 15px; }
  </style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div id="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L22 12L12 22L2 12L12 2Z" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 7L17 12L12 17L7 12L12 7Z" stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round"/>
      </svg>
    </div>
    <button id="new-thread-btn" onclick="newChat()">+ New Thread</button>
  </div>

  <div id="messages-area">
    <div id="messages-inner"></div>
  </div>

  <div id="input-area">
    <div id="input-wrapper">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Type a message..."
        onkeydown="handleKey(event)"
        oninput="autoResize()"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  let conversations = [], activeConvId = null, isStreaming = false;
  const BACKEND_URL = 'http://localhost:8000';

  function md(text) {
    if (!text) return '';
    return marked.parse(text, { breaks: true, gfm: true });
  }

  function scrollBottom() {
    const a = document.getElementById('messages-area');
    a.scrollTop = a.scrollHeight;
  }

  function getActiveConv() {
    return conversations.find(c => c.id === activeConvId);
  }

  function showWelcome() {
    const inner = document.getElementById('messages-inner');
    inner.innerHTML = `
      <div id="welcome-screen">
        <h1>What can I help you with?</h1>
        <div class="starter-list">
          <button class="starter-btn" onclick="useStarter(this)">Explain quantum computing simply</button>
          <button class="starter-btn" onclick="useStarter(this)">Write a Python web scraper</button>
          <button class="starter-btn" onclick="useStarter(this)">Draft a professional email</button>
          <button class="starter-btn" onclick="useStarter(this)">Summarize the idea of superposition</button>
        </div>
      </div>`;
  }

  function hideWelcome() {
    const w = document.getElementById('welcome-screen');
    if (w) w.remove();
  }

  function newChat() {
    const conv = { id: Date.now(), messages: [] };
    conversations.push(conv);
    activeConvId = conv.id;
    showWelcome();
  }

  function appendMessage(role, content, animate = true) {
    hideWelcome();
    const inner = document.getElementById('messages-inner');
    const row = document.createElement('div');
    row.className = 'msg-row';
    if (!animate) row.style.animation = 'none';

    const label = document.createElement('span');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You: ' : 'AI: ';

    const contentEl = document.createElement('span');
    contentEl.className = 'msg-content';

    if (role === 'user') {
      contentEl.textContent = content;
    } else {
      contentEl.innerHTML = content ? md(content) : '';
    }

    row.appendChild(label);
    row.appendChild(contentEl);
    inner.appendChild(row);
    scrollBottom();
    return { row, contentEl };
  }

  function showTyping() {
    hideWelcome();
    const inner = document.getElementById('messages-inner');
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.id = 'typing-row';

    const label = document.createElement('span');
    label.className = 'msg-label';
    label.textContent = 'AI: ';

    const contentEl = document.createElement('span');
    contentEl.className = 'msg-content streaming-cursor';

    row.appendChild(label);
    row.appendChild(contentEl);
    inner.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing-row');
    if (t) t.remove();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize() {
    const tx = document.getElementById('user-input');
    tx.style.height = 'auto';
    tx.style.height = Math.min(tx.scrollHeight, 120) + 'px';
    tx.style.overflowY = tx.scrollHeight > 120 ? 'auto' : 'hidden';
  }

  function useStarter(btn) {
    const text = btn.textContent.replace(/^→\s*/, '').trim();
    document.getElementById('user-input').value = text;
    autoResize();
    sendMessage();
  }

  async function sendMessage() {
    if (isStreaming) return;
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    if (!activeConvId) newChat();
    const conv = getActiveConv();
    if (!conv) return;

    conv.messages.push({ role: 'user', content: text });
    appendMessage('user', text);
    input.value = '';
    input.style.height = 'auto';

    isStreaming = true;
    document.getElementById('send-btn').disabled = true;
    showTyping();

    let aiText = '', aiContentEl = null;

    try {
      const res = await fetch(BACKEND_URL + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: conv.messages,
          system_prompt: 'You are a helpful, friendly AI assistant powered by a fine-tuned Qwen2.5 model.',
          temperature: 0.7,
          max_new_tokens: 512,
          top_p: 0.9
        }),
        signal: AbortSignal.timeout(300000)
      });

      if (!res.ok || !res.body) throw new Error('Server error: ' + res.status);

      removeTyping();
      const { contentEl } = appendMessage('assistant', '', true);
      aiContentEl = contentEl;
      aiContentEl.classList.add('streaming-cursor');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') break;
          try {
            const j = JSON.parse(raw);
            if (j.token) {
              aiText += j.token;
              aiContentEl.innerHTML = md(aiText);
              aiContentEl.classList.add('streaming-cursor');
              scrollBottom();
            }
          } catch {}
        }
      }

    } catch (err) {
      removeTyping();
      if (!aiContentEl) {
        const { contentEl } = appendMessage('assistant', '', true);
        aiContentEl = contentEl;
      }
      aiText = 'Connection error: ' + err.message;
      aiContentEl.textContent = aiText;
    }

    if (aiContentEl) aiContentEl.classList.remove('streaming-cursor');
    conv.messages.push({ role: 'assistant', content: aiText });
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    scrollBottom();
  }

  newChat();
</script>
</body>
</html>
